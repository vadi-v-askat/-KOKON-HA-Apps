name: KOKON Zigbee2MQTT MR4U Fresh
version: 2.14.2-2
slug: kokon_z2m_mr4u_fresh
description: Independent stopped Zigbee2MQTT wrapper for the SMLIGHT SLZB-MR4U.
url: https://github.com/zigbee2mqtt/hassio-zigbee2mqtt
startup: application
arch:
  - amd64
init: false
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:zigbee
panel_title: KOKON Zigbee2MQTT MR4U Fresh
panel_admin: true
timeout: 30
backup: hot
stage: experimental
map:
  - type: app_config
    read_only: false
    path: /config
  - type: ssl
    read_only: true
ports:
  8099/tcp: null
options:
  data_path: /config/zigbee2mqtt_mr4u_fresh
  mqtt: {}
  serial: {}
  advanced:
    channel: 25
  permit_join: false
  homeassistant:
    enabled: false
schema:
  data_path: str
  mqtt:
    server: match(^mqtt://[^/:]+(?::[0-9]+)?$)
    user: str
    password: password
    base_topic: match(^[A-Za-z0-9_-]+$)
  serial:
    port: match(^tcp://[^/:]+:6638$)
    adapter: match(ember)
  advanced:
    channel: int(11,26)
    pan_id: int(1,65534)
    ext_pan_id: match(^[0-9A-Fa-f]{16}$)
    network_key: password
  permit_join: bool
  homeassistant:
    enabled: bool
  watchdog: str?
